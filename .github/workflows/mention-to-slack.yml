name: mention-to-slack

on:
  schedule:
    - cron: "*/5 * * * *"
    # 60 日間リポジトリに動きがないと schedule が止まるのを防ぐ
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      comment_url:
        description: 指定したコメントを送る（動作確認用。例 https://github.com/o/r/issues/1#issuecomment-123）
        required: false
      keepalive:
        description: keepalive job だけを実行する（動作確認用）
        type: boolean
        default: false

jobs:
  keepalive:
    if: github.event.schedule == '0 0 1 * *' || inputs.keepalive
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Enable workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/mention-to-slack.yml/enable"

  notify:
    if: github.event.schedule != '0 0 1 * *' && !inputs.keepalive
    runs-on: ubuntu-latest
    concurrency:
      group: mention-to-slack
    env:
      # 見出し・Issue へのリンク・引用した本文のメッセージを作る（$issue は投稿先の Issue）
      MESSAGE_FILTER: |
        def escape: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
        ((.body // "") | gsub("\r"; "") | rtrimstr("\n")) as $body
        | ($issue.repository_url | sub(".*/repos/"; "")) as $repo
        | {text: (
            "参加しているIssueで *\(.user.login)* \(if .issue_url then "のコメントが投稿されました" else "がIssueを作成しました" end)\n"
            + "<\(.html_url)|\($repo)#\($issue.number) \($issue.title | escape)>\n"
            + ($body | split("\n") | map(select(test("\\S"))) | join("\n") as $compact
                | $compact | split("\n") | .[0:5] | join("\n")
                | if length > 300 then .[0:300] else . end
                | if . != $compact then . + " …" else . end
                | escape | gsub("@\($me)\\b"; "<@\($slack)>"; "i")
                | split("\n") | map("> " + .) | join("\n"))
          )}
      # $repo の送り先の Webhook URL とメンバー ID を返す（リポジトリ名の一致を "org/*" より優先し、どちらもなければ空）
      ROUTE_FILTER: |
        ($routes[$repo] // $routes[($repo | split("/")[0]) + "/*"]) // empty
        | [.webhook_url // error("\($repo) の webhook_url がありません"), .member_id] | @tsv
    steps:
      - name: Notify specified comment
        if: inputs.comment_url != ''
        env:
          GH_TOKEN: ${{ secrets.NOTIFICATIONS_TOKEN }}
          SLACK_ROUTES: ${{ secrets.SLACK_ROUTES }}
          COMMENT_URL: ${{ inputs.comment_url }}
        run: |
          path=${COMMENT_URL#https://github.com/}
          repo=$(echo "$path" | cut -d/ -f1-2)
          route=$(jq -nr --arg repo "$repo" --argjson routes "$SLACK_ROUTES" "$ROUTE_FILTER")
          [ -n "$route" ] || { echo "::error::$repo の送り先が SLACK_ROUTES にありません"; exit 1; }
          IFS=$'\t' read -r slack_webhook_url slack_member_id <<< "$route"
          issue=$(gh api "repos/$repo/issues/$(echo "$path" | cut -d/ -f4 | cut -d'#' -f1)")
          gh api "repos/$repo/issues/comments/${COMMENT_URL##*issuecomment-}" \
            | jq --arg me "$(gh api user --jq .login)" --arg slack "$slack_member_id" --argjson issue "$issue" "$MESSAGE_FILTER" \
            | curl -sf -X POST -H 'Content-type: application/json' --data @- "$slack_webhook_url"

      - name: Restore last checked time
        if: inputs.comment_url == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            last_checked
            sent
          key: last-checked-${{ github.run_id }}
          restore-keys: last-checked-

      - name: Notify issue activities
        if: inputs.comment_url == ''
        env:
          GH_TOKEN: ${{ secrets.NOTIFICATIONS_TOKEN }}
          SLACK_ROUTES: ${{ secrets.SLACK_ROUTES }}
        run: |
          now=$(date -u +%FT%TZ)
          # 通知は投稿から遅れて作られるので、前回チェックより 10 分さかのぼって取得する
          since=$(jq -rn --arg t "$(cat last_checked 2>/dev/null || echo "$now")" '$t | fromdate - 600 | todate')
          touch sent
          me=$(gh api user --jq .login)

          # 自分が作成・コメント・アサイン・メンションされた Issue のスレッド
          gh api "notifications?all=true&participating=true&since=$since" --paginate \
            --jq '.[] | select(.subject.type == "Issue") | [.repository.full_name, .subject.url] | @tsv' |
          while IFS=$'\t' read -r repo url; do
            # 送り先が SLACK_ROUTES にないリポジトリは対象外
            route=$(jq -nr --arg repo "$repo" --argjson routes "$SLACK_ROUTES" "$ROUTE_FILTER")
            [ -n "$route" ] || continue
            IFS=$'\t' read -r slack_webhook_url slack_member_id <<< "$route"
            # 前回チェック以降に他人が投稿した Issue 本文とコメントを通知する
            issue=$(gh api "$url")
            { printf '%s\n' "$issue"; gh api "$url/comments?since=$since" --paginate --jq '.[]'; } \
              | jq -c --arg me "$me" --arg since "$since" 'select(.created_at >= $since and .user.login != $me)' |
            while read -r item; do
              # 送信済みの投稿は飛ばす
              read -r created_at html_url < <(printf '%s' "$item" | jq -r '"\(.created_at) \(.html_url)"')
              cut -d' ' -f2 sent | grep -qxF "$html_url" && continue
              printf '%s' "$item" \
                | jq --arg me "$me" --arg slack "$slack_member_id" --argjson issue "$issue" "$MESSAGE_FILTER" \
                | curl -sf -X POST -H 'Content-type: application/json' --data @- "$slack_webhook_url"
              echo "$created_at $html_url" >> sent
            done
          done

          echo "$now" > last_checked
          # 次回さかのぼる範囲より古い送信記録は捨てる
          awk -v since="$(jq -rn --arg t "$now" '$t | fromdate - 600 | todate')" '$1 >= since' sent > sent.tmp
          mv sent.tmp sent

      - name: Save last checked time
        if: inputs.comment_url == ''
        uses: actions/cache/save@v4
        with:
          path: |
            last_checked
            sent
          key: last-checked-${{ github.run_id }}
