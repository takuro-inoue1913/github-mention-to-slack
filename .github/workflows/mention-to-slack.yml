name: mention-to-slack

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      comment_url:
        description: 指定したコメントを送る（動作確認用。例 https://github.com/o/r/issues/1#issuecomment-123）
        required: false

concurrency:
  group: mention-to-slack

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      # 本文はコードブロックで送り、自分へのメンションがあれば投稿者名の横で Slack メンションする
      MESSAGE_FILTER: |
        (.body // "") as $body
        | {text: "<\(.html_url)|\(.html_url | sub("https://github.com/"; ""))>\n*\(.user.login)*\(if ($body | test("@\($me)\\b"; "i")) then " <@\($slack)>" else "" end)\n```\n\($body[0:3000] | gsub("```"; "'''") | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;"))\n```"}
    steps:
      - name: Notify specified comment
        if: inputs.comment_url != ''
        env:
          GH_TOKEN: ${{ secrets.NOTIFICATIONS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MEMBER_ID: ${{ vars.SLACK_MEMBER_ID }}
          COMMENT_URL: ${{ inputs.comment_url }}
        run: |
          repo=$(echo "${COMMENT_URL#https://github.com/}" | cut -d/ -f1-2)
          gh api "repos/$repo/issues/comments/${COMMENT_URL##*issuecomment-}" \
            | jq --arg me "$(gh api user --jq .login)" --arg slack "$SLACK_MEMBER_ID" "$MESSAGE_FILTER" \
            | curl -sf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"

      - name: Restore last checked time
        if: inputs.comment_url == ''
        uses: actions/cache/restore@v4
        with:
          path: last_checked
          key: last-checked-${{ github.run_id }}
          restore-keys: last-checked-

      - name: Notify issue activities
        if: inputs.comment_url == ''
        env:
          GH_TOKEN: ${{ secrets.NOTIFICATIONS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MEMBER_ID: ${{ vars.SLACK_MEMBER_ID }}
        run: |
          now=$(date -u +%FT%TZ)
          since=$(cat last_checked 2>/dev/null || date -u -d '-10 min' +%FT%TZ)
          me=$(gh api user --jq .login)

          # 自分が作成・コメント・アサイン・メンションされた Issue のスレッド
          gh api "notifications?all=true&participating=true&since=$since" --paginate \
            --jq '.[] | select(.subject.type == "Issue") | .subject.url' |
          while read -r url; do
            # 前回チェック以降に他人が投稿した Issue 本文とコメントを通知する
            { gh api "$url"; gh api "$url/comments?since=$since" --paginate --jq '.[]'; } \
              | jq -c --arg me "$me" --arg since "$since" 'select(.created_at >= $since and .user.login != $me)' |
            while read -r item; do
              printf '%s' "$item" \
                | jq --arg me "$me" --arg slack "$SLACK_MEMBER_ID" "$MESSAGE_FILTER" \
                | curl -sf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
            done
          done

          echo "$now" > last_checked

      - name: Save last checked time
        if: inputs.comment_url == ''
        uses: actions/cache/save@v4
        with:
          path: last_checked
          key: last-checked-${{ github.run_id }}
