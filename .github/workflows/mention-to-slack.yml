name: mention-to-slack

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      comment_url:
        description: 指定したコメントを送る（動作確認用。例 https://github.com/o/r/issues/1#issuecomment-123）
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify specified comment
        if: inputs.comment_url != ''
        env:
          GH_TOKEN: ${{ secrets.NOTIFICATIONS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MEMBER_ID: ${{ vars.SLACK_MEMBER_ID }}
          COMMENT_URL: ${{ inputs.comment_url }}
        run: |
          repo=$(echo "${COMMENT_URL#https://github.com/}" | cut -d/ -f1-2)
          gh api "repos/$repo/issues/comments/${COMMENT_URL##*issuecomment-}" \
            | jq --arg me "$(gh api user --jq .login)" --arg slack "$SLACK_MEMBER_ID" '{text: "<\(.html_url)|\(.html_url | sub("https://github.com/"; ""))>\n*\(.user.login)*: \(.body[0:500] | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;") | gsub("@\($me)\\b"; "<@\($slack)>"; "i"))"}' \
            | curl -sf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"

      - name: Restore last checked time
        if: inputs.comment_url == ''
        uses: actions/cache/restore@v4
        with:
          path: last_checked
          key: last-checked-${{ github.run_id }}
          restore-keys: last-checked-

      - name: Notify mentions
        if: inputs.comment_url == ''
        env:
          GH_TOKEN: ${{ secrets.NOTIFICATIONS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MEMBER_ID: ${{ vars.SLACK_MEMBER_ID }}
        run: |
          now=$(date -u +%FT%TZ)
          since=$(cat last_checked 2>/dev/null || date -u -d '-10 min' +%FT%TZ)
          me=$(gh api user --jq .login)

          gh api "notifications?all=true&since=$since" --paginate \
            --jq '.[] | select(.reason == "mention") | .subject.latest_comment_url // empty' |
          while read -r url; do
            # スレッドの最新コメントに自分へのメンションが含まれるときだけ通知する
            gh api "$url" \
              | jq -e --arg me "@$me" 'select(.body | ascii_downcase | contains($me | ascii_downcase))' > comment.json \
              || continue
            jq --arg me "$me" --arg slack "$SLACK_MEMBER_ID" '{text: "<\(.html_url)|\(.html_url | sub("https://github.com/"; ""))>\n*\(.user.login)*: \(.body[0:500] | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;") | gsub("@\($me)\\b"; "<@\($slack)>"; "i"))"}' comment.json \
              | curl -sf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
          done

          echo "$now" > last_checked

      - name: Save last checked time
        if: inputs.comment_url == ''
        uses: actions/cache/save@v4
        with:
          path: last_checked
          key: last-checked-${{ github.run_id }}
